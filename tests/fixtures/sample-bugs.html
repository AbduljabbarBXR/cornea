<!DOCTYPE html>
<html>
<head>
  <title>Cornea Sample — known layout bugs</title>
  <!-- This fixture intentionally contains overlap, overflow, and contrast bugs
       so the CI smoke test can assert they are detected. -->
  <style>
    body { margin: 0; font-family: sans-serif; }
    .header { background-color: #333; color: #fff; padding: 10px; height: 50px; }
    .row { display: flex; width: 100%; }
    .card { flex: 1; margin: 8px; padding: 12px; background-color: #eee; height: 80px; }
    .card h3 { color: #333; }
    .card p { color: #666; }
    .hidden { display: none; }
    .overlap-left { position: absolute; left: 20px; top: 20px; width: 200px; height: 100px; background-color: red; }
    .overlap-right { position: absolute; left: 150px; top: 40px; width: 200px; height: 100px; background-color: blue; }
    .overflow-bad { width: 600px; height: 50px; background-color: yellow; }
    .low-contrast { color: #cccccc; background-color: #ffffff; }
  </style>
</head>
<body>
  <header class="header">Cornea Test</header>
  <main>
    <section class="row">
      <div class="card"><h3>Card 1</h3><p>First card text</p></div>
      <div class="card"><h3>Card 2</h3><p>Second card</p></div>
      <div class="card"><h3>Card 3</h3><p>Third card</p></div>
    </section>
    <div class="overlap-left">Left overlap</div>
    <div class="overlap-right">Right overlap</div>
    <div class="overflow-bad">This is wider than the viewport</div>
    <p class="low-contrast">Hard to read on white</p>
    <div class="hidden">Should not appear</div>
  </main>
  <footer>Footer text</footer>
</body>
</html>
