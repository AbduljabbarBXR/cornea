[package]
name = "cornea"
version = "0.1.0"
edition = "2024"
description = "Deterministic visual inspection engine + MCP server for AI agents"
license = "MIT"
readme = "README.md"
repository = "https://github.com/AbduljabbarBXR/cornea"
homepage = "https://github.com/AbduljabbarBXR/cornea"
keywords = ["visual", "inspection", "layout", "mcp", "deterministic"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".heides/", "target/"]

[[bin]]
name = "cornea"
path = "src/main.rs"

[dependencies]
boa_engine = "0.22"
html5ever = "0.27.0"
markup5ever_rcdom = "0.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
